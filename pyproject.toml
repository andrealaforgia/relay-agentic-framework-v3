[project]
name = "relay"
version = "3.0.0a0"
description = "Distributed, collaborative, multi-provider agentic software development framework."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Andrea Laforgia" }]
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the real PostgreSQL and Redis from compose.yaml",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["relay"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
