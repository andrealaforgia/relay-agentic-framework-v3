# The same gate a developer runs before a commit: `make check`. It lints, type-checks
# and runs every test against a real PostgreSQL, Redis, Git and Docker. No test calls
# a model, so the pipeline needs no provider credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint, type-check and test
        run: make check

      - name: Show the services' logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the services
        if: always()
        run: docker compose down --volumes
